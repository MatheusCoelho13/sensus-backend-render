server:
  port: ${PORT:8080}

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/visaoassistiva}}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  cors:
    allowed-origins:
      - http://localhost:5173
      - https://sensus-frontend.vercel.app
      - https://*.vercel.app
  ia:
    base-url: ${APP_IA_BASE_URL:http://localhost:8000}
    timeout-connect-ms: 2000
    timeout-read-ms: 5000
  websocket:
    max-text-message-size-bytes: 10485760
    max-binary-message-size-bytes: 10485760
  rate-limit:
    fps: 5
  persistencia:
    habilitada: true
  filtro:
    classes-relevantes: []

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.visaoassistiva: DEBUG
    org.springframework.web: INFO
  pattern:
    console: "%d{HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"